{% if friend_links %}
<section class="db-friendlinks" aria-label="友情链接">
    <div class="db-fl-container">
        <h2 class="db-fl-heading">友情链接</h2>
        <ul class="db-fl-list">
            {% for link in friend_links %}
            <li class="db-fl-item">
                <a class="db-fl-link" href="{{ link.url }}" target="_blank" rel="noopener noreferrer" title="{{ link.name }}">
                    {% if link.logo %}<img class="db-fl-logo" src="{{ link.logo }}" alt="{{ link.name }}" loading="lazy" width="28" height="28">{% endif %}
                    <span class="db-fl-name">{{ link.name }}</span>
                    {% if link.description %}<span class="db-fl-desc">{{ link.description }}</span>{% endif %}
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>
</section>
<style>
.db-friendlinks{background:#0a131d;color:#fff;padding:28px 0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;}
.db-fl-container{max-width:1200px;margin:0 auto;padding:0 24px;box-sizing:border-box;}
.db-fl-heading{margin:0 0 16px;font-size:16px;font-weight:600;color:#fff;letter-spacing:.05em;}
.db-fl-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px 28px;}
.db-fl-item{margin:0;}
.db-fl-link{display:inline-flex;align-items:center;gap:8px;max-width:100%;color:#cbd5e1;text-decoration:none;font-size:14px;line-height:1.4;transition:color .2s;}
.db-fl-link:hover{color:#4f84ff;}
.db-fl-logo{width:28px;height:28px;border-radius:6px;object-fit:cover;flex:0 0 auto;}
.db-fl-name{white-space:nowrap;}
.db-fl-desc{color:#7c8aa0;font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
</style>
{% endif %}
